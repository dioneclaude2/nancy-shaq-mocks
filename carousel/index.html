<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<style>*{box-sizing:border-box}body{margin:0}img{max-width:100%}</style>
<title>Medusa Night Carousel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap">
<style>
/* Layout: each option is a band: the swipeable post beside its story and slide-by-slide list. */
:root { --bg:#fbf3f4; --fg:#2a1a24; --muted:#7a6470; --line:#eed5e0; --accent:#d1009f; --card:#ffffff; --display:"Instrument Serif",Georgia,serif; --body:"DM Sans",-apple-system,"Helvetica Neue",Arial,sans-serif; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#1b1218; --fg:#f8ebf1; --muted:#b59dab; --line:#3d2a35; --accent:#ff4fd1; --card:#261a22; color-scheme:dark } }
:root[data-theme="dark"] { --bg:#1b1218; --fg:#f8ebf1; --muted:#b59dab; --line:#3d2a35; --accent:#ff4fd1; --card:#261a22; color-scheme:dark }
body { background:var(--bg); color:var(--fg); font-family:var(--body); font-size:15px; line-height:1.45; }
.wrap { max-width:1120px; margin:0 auto; padding-block:32px 56px; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)); }
h1 { font-family:var(--display); font-weight:400; font-size:clamp(34px,5vw,50px); line-height:1.05; margin:0 0 4px; }
.sub { color:var(--muted); margin:0 0 8px; }
.opt { display:grid; grid-template-columns:minmax(0,400px) minmax(0,1fr); gap:32px; align-items:start; padding-block:28px; border-top:1px solid var(--line); margin-top:20px; }
@media (max-width:820px) { .opt { grid-template-columns:minmax(0,1fr); } }
.post { background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden; }
.head { display:flex; align-items:center; gap:8px; padding:10px 12px; font-weight:600; font-size:14px; }
.dot { width:30px; height:30px; border-radius:50%; background:#ff00d1; color:#fcf6eb; display:grid; place-items:center; font-family:var(--display); font-size:19px; }
.stage { position:relative; }
.slides { display:flex; overflow-x:auto; scroll-snap-type:x mandatory; aspect-ratio:4/5; max-width:100%; scrollbar-width:none; background:#000; }
.slides::-webkit-scrollbar { display:none; }
.slides img, .slides video { flex:0 0 100%; width:100%; height:100%; object-fit:cover; scroll-snap-align:center; }
.count { position:absolute; top:10px; right:10px; background:rgba(0,0,0,.62); color:#fff; font-size:12px; font-weight:600; padding:3px 9px; border-radius:999px; font-variant-numeric:tabular-nums; }
.nav { position:absolute; top:50%; transform:translateY(-50%); width:32px; height:32px; border:0; border-radius:50%; background:rgba(255,255,255,.85); color:#111; font-size:17px; cursor:pointer; }
.prev { left:8px; } .next { right:8px; }
.snd { position:absolute; left:10px; bottom:10px; border:0; border-radius:999px; background:rgba(0,0,0,.62); color:#fff; font:600 12px var(--body); padding:4px 10px; cursor:pointer; }
.dots { display:flex; justify-content:center; gap:4px; padding:10px 0 6px; }
.dots i { width:6px; height:6px; border-radius:50%; background:var(--muted); opacity:.35; }
.dots i.on { background:var(--accent); opacity:1; }
.cap { padding:2px 12px 14px; margin:0; overflow-wrap:anywhere; }
.tags { color:var(--accent); }
.info { min-width:0; }
.kicker { color:var(--accent); font-weight:600; font-size:13px; letter-spacing:.04em; text-transform:uppercase; margin:0; }
h2 { font-family:var(--display); font-weight:400; font-size:34px; line-height:1.1; margin:2px 0 8px; }
.story { margin:0 0 14px; max-width:62ch; }
ol { list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:2px 20px; }
@media (max-width:560px) { ol { grid-template-columns:minmax(0,1fr); } }
li button { width:100%; display:grid; grid-template-columns:24px 40px minmax(0,1fr); gap:8px; align-items:center; text-align:left; background:none; border:0; color:inherit; font:inherit; padding:5px 4px; border-radius:6px; cursor:pointer; }
li button.on { background:var(--card); box-shadow:inset 0 0 0 1px var(--accent); }
li .n { color:var(--accent); font-family:var(--display); font-size:20px; font-variant-numeric:tabular-nums; }
li img { width:40px; height:50px; object-fit:cover; border-radius:3px; display:block; }
li b { font-weight:600; display:block; font-size:14px; }
li small { color:var(--muted); font-size:12.5px; display:block; line-height:1.3; }
button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Medusa's night out</h1>
  <p class="sub">Two 15-slide wordless carousels at 4:5, mixing photos and video. Swipe a post, or tap a slide in its list.</p>
  <div id="opts"></div>
</div>
<script>
const DATA = [{"name": "Option 1", "title": "Medusa vs. the door", "story": "An underdog story with a clear plot. It opens on the win with Shaq, rewinds to the squad getting ready, shows the door turning Medusa away, follows the toy inside, then ends back with Shaq. The feeling: she got rejected and still won.", "cap": "we met shaq. we got rejected. we peaked.!!!!! until next halloween :)", "items": [{"t": "s", "f": "m/o1-01.jpg", "l": "Cover", "w": "The hook: why is this next to Shaq?"}, {"t": "v", "f": "m/o1-02.mp4", "p": "m/o1-02.jpg", "l": "Shaq meets Medusa", "w": "It really happened, and it moves."}, {"t": "s", "f": "m/o1-03.jpg", "l": "Loading the car", "w": "Rewind: earlier that night."}, {"t": "s", "f": "m/o1-04.jpg", "l": "Squad lineup", "w": "Medusa and her security team."}, {"t": "s", "f": "m/o1-05.jpg", "l": "The lift", "w": "Peak confidence before the fall."}, {"t": "s", "f": "m/o1-06.jpg", "l": "At the door", "w": "The doorman looks up."}, {"t": "s", "f": "m/o1-07.jpg", "l": "Door says no", "w": "He points her away."}, {"t": "v", "f": "m/o1-08.mp4", "p": "m/o1-08.jpg", "l": "Taken away", "w": "She is led off, screaming."}, {"t": "s", "f": "m/o1-09.jpg", "l": "Outside", "w": "The squad is left on the street."}, {"t": "v", "f": "m/o1-10.mp4", "p": "m/o1-10.jpg", "l": "The small one got in", "w": "The toy made it inside."}, {"t": "s", "f": "m/o1-11.jpg", "l": "Champagne", "w": "Celebrating without her."}, {"t": "v", "f": "m/o1-12.mp4", "p": "m/o1-12.jpg", "l": "Shaq on the decks", "w": "The night goes on."}, {"t": "v", "f": "m/o1-13.mp4", "p": "m/o1-13.jpg", "l": "Everyone films", "w": "Medusa is back, and now she is the show."}, {"t": "v", "f": "m/o1-14.mp4", "p": "m/o1-14.jpg", "l": "The shimmy", "w": "The payoff with Shaq."}, {"t": "s", "f": "m/o1-15.jpg", "l": "Group photo", "w": "Rejected, and still in the photo."}]}, {"name": "Option 2", "title": "The camera roll", "story": "Closer to Nude Project. There is no plot, just a night seen through everyone's phones. Every slide changes scale and mood: big and small, wide and close, club and street. The feeling: you had to be there, and you wish you were.", "cap": "one night. no notes. until next halloween :)", "items": [{"t": "s", "f": "m/o2-01.jpg", "l": "Cover", "w": "The hook, same as Option 1."}, {"t": "v", "f": "m/o2-02.mp4", "p": "m/o2-02.jpg", "l": "Shaq on the mic", "w": "Straight into the club."}, {"t": "s", "f": "m/o2-03.jpg", "l": "Medusa falling", "w": "Cut to chaos on an empty street."}, {"t": "v", "f": "m/o2-04.mp4", "p": "m/o2-04.jpg", "l": "Lasers", "w": "Shaq from behind, felt not posed."}, {"t": "s", "f": "m/o2-05.jpg", "l": "Squad stack", "w": "The absurd one: nobody explains it."}, {"t": "v", "f": "m/o2-06.mp4", "p": "m/o2-06.jpg", "l": "Champagne dip", "w": "A small, silly bar moment."}, {"t": "s", "f": "m/o2-07.jpg", "l": "Her face", "w": "The person inside, up close."}, {"t": "v", "f": "m/o2-08.mp4", "p": "m/o2-08.jpg", "l": "The floor", "w": "Pure club energy."}, {"t": "s", "f": "m/o2-09.jpg", "l": "The doorman", "w": "He points. No context given."}, {"t": "v", "f": "m/o2-10.mp4", "p": "m/o2-10.jpg", "l": "Outside", "w": "The comedown on the pavement."}, {"t": "s", "f": "m/o2-11.jpg", "l": "Street lineup", "w": "Everyone in full, head to toe."}, {"t": "v", "f": "m/o2-12.mp4", "p": "m/o2-12.jpg", "l": "The line", "w": "The whole squad waits."}, {"t": "s", "f": "m/o2-13.jpg", "l": "The car", "w": "Packing up the bags."}, {"t": "v", "f": "m/o2-14.mp4", "p": "m/o2-14.jpg", "l": "Shimmy", "w": "Everyone together at last."}, {"t": "s", "f": "m/o2-15.jpg", "l": "Group photo", "w": "The one you would pin in the group chat."}]}];
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
const root = document.getElementById("opts");
let unmuted = false;
DATA.forEach((o, oi) => {
  const vids = o.items.filter(x => x.t === "v").length;
  const el = document.createElement("section"); el.className = "opt";
  el.innerHTML = `<article class="post"><div class="head"><span class="dot">N</span>nancymonsters</div>
    <div class="stage"><div class="slides" tabindex="0" aria-label="${o.name} carousel"></div><span class="count"></span>
    <button class="nav prev" aria-label="Previous slide">&#8249;</button><button class="nav next" aria-label="Next slide">&#8250;</button>
    <button class="snd" hidden>Sound off</button></div>
    <div class="dots"></div>
    <p class="cap"><b>nancymonsters</b> ${esc(o.cap)} <span class="tags">#Shaq #DJDiesel #Halloween2026</span></p></article>
    <div class="info"><p class="kicker">${o.name}: ${15 - vids} photos, ${vids} videos</p><h2>${esc(o.title)}</h2><p class="story">${esc(o.story)}</p><ol></ol></div>`;
  root.appendChild(el);
  const box = el.querySelector(".slides"), dots = el.querySelector(".dots"), list = el.querySelector("ol"), count = el.querySelector(".count"), snd = el.querySelector(".snd");
  o.items.forEach((s, i) => {
    let m;
    if (s.t === "v") { m = document.createElement("video"); m.src = s.f; m.poster = s.p; m.muted = true; m.loop = true; m.playsInline = true; m.preload = "none"; m.setAttribute("playsinline", ""); }
    else { m = new Image(); m.src = s.f; m.alt = s.l; m.loading = "lazy"; }
    box.appendChild(m);
    dots.appendChild(document.createElement("i"));
    const li = document.createElement("li");
    li.innerHTML = `<button id="o${oi}s${i}"><span class="n">${i + 1}</span><img src="${s.t === "v" ? s.p : s.f}" alt="" loading="lazy"><span><b>${esc(s.l)}${s.t === "v" ? " (video)" : ""}</b><small>${esc(s.w)}</small></span></button>`;
    li.firstChild.addEventListener("click", () => go(i));
    list.appendChild(li);
  });
  const go = i => box.scrollTo({ left: i * box.clientWidth, behavior: "smooth" });
  const cur = () => Math.round(box.scrollLeft / box.clientWidth);
  let last = -1;
  function mark() {
    const k = cur(); count.textContent = (k + 1) + "/15";
    dots.querySelectorAll("i").forEach((d, n) => d.classList.toggle("on", n === k));
    list.querySelectorAll("button").forEach((d, n) => d.classList.toggle("on", n === k));
    if (k === last) return; last = k;
    [...box.children].forEach((m, n) => { if (m.tagName === "VIDEO") { if (n === k) { m.muted = !unmuted; m.play().catch(() => {}); } else { m.pause(); } } });
    snd.hidden = box.children[k].tagName !== "VIDEO";
    snd.textContent = unmuted ? "Sound on" : "Sound off";
  }
  snd.addEventListener("click", () => { unmuted = !unmuted; const v = box.children[cur()]; v.muted = !unmuted; v.play().catch(() => {}); snd.textContent = unmuted ? "Sound on" : "Sound off"; });
  box.addEventListener("scroll", mark, { passive: true }); mark();
  el.querySelector(".prev").addEventListener("click", () => go(Math.max(0, cur() - 1)));
  el.querySelector(".next").addEventListener("click", () => go(Math.min(14, cur() + 1)));
});
</script>

</body>
</html>
